[package]
name = "session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["serde", "v4"] }

# Windows: a folder's volume serial number and file index (`GetFileInformationByHandle`),
# which std only offers behind an unstable feature. Already in the lock via `same-file`.
[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"

[dev-dependencies]
proptest = "1"
assert_cmd = "2"
tempfile = "3"

[[bin]]
name = "crash_writer"
path = "src/bin/crash_writer.rs"
