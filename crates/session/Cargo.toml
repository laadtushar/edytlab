[package]
name = "session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["serde", "v4"] }

# Windows: a folder's volume serial number and 128-bit file id
# (`GetFileInformationByHandleEx` with `FileIdInfo`), which std only offers behind
# an unstable feature. 0.61.2 is the version already in the lock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[features]
# `Store::open`, the open that asks the registry nothing. Only tests use it, so
# only dev-dependencies enable it; see the doc on `Store::open`.
raw-open = []

[dev-dependencies]
# This crate's own integration tests use `Store::open`.
session = { path = ".", features = ["raw-open"] }
proptest = "1"
assert_cmd = "2"
tempfile = "3"

[[bin]]
name = "crash_writer"
path = "src/bin/crash_writer.rs"
