[package]
name = "audio-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
audio-decoder = { path = "../audio-decoder" }
audio-io = { path = "../audio-io" }
session = { path = "../session" }
hound = "3.5"
# `rayon` is declared per the Phase 1 plan, but the rendering path is
# deliberately single-threaded for cross-platform determinism (see
# `src/render.rs`). Do not introduce `par_iter` or `rayon::scope` into
# the render path without revisiting the determinism acceptance criterion.
rayon = "1"
# M21: per-track resample-to-project-rate during multi-track mixdown. Same
# rubato version that audio-io uses for the realtime path; reused for the
# offline path so resampling characteristics match.
rubato = "0.16"
# Temp WAV used by `play_state` for multi-track preview. Dropped
# after `output.write_samples` returns; the OutputStream owns the
# audio data from there on.
tempfile = "3"
thiserror = "2"

[build-dependencies]
hound = "3.5"

[dev-dependencies]
hound = "3.5"
# M21: FFT-based spectral assertions for the multi-track mix tests
# (sum-of-tones must show both peaks). `realfft` is the workspace-blessed
# FFT crate (see crates/audio-analysis/Cargo.toml).
realfft = "3"
tempfile = "3"
