[package]
name = "ml-demucs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The ONNX Runtime binding, declared once in the root `Cargo.toml` (the
# exact version, the `api-23` level and why).
ort.workspace = true
ml-pipeline = { path = "../ml-pipeline" }
audio-decoder = { path = "../audio-decoder" }
hound = "3.5"
# The STFT/iSTFT that htdemucs runs outside the network (`spec.rs`). The
# workspace-blessed FFT path, as in audio-time and audio-analysis.
realfft = "3"
# Sample-rate conversion to and from the network's 44.1 kHz (`resample.rs`),
# the converter ml-whisper and audio-engine use.
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
