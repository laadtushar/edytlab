[package]
name = "ml-demucs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Match ml-whisper / ml-pipeline ORT configuration exactly so the workspace
# pulls a single ONNX Runtime crate. `load-dynamic` keeps the build
# offline-friendly: the host process dlopens libonnxruntime.{so,dylib,dll}
# via ORT_DYLIB_PATH at first session creation.
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
ndarray = "0.16"
ml-pipeline = { path = "../ml-pipeline" }
audio-decoder = { path = "../audio-decoder" }
hound = "3.5"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
