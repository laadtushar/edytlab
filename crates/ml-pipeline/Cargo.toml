[package]
name = "ml-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Match ml-whisper's `ort` configuration exactly so the workspace pulls a
# single ONNX Runtime crate. `load-dynamic` keeps the build offline-friendly:
# the host process dlopens libonnxruntime.{so,dylib,dll} via ORT_DYLIB_PATH
# at first session creation. Tests gracefully skip when the runtime is
# absent. Execution-provider opt-ins (CoreML, CUDA) are dispatched at
# runtime through `load-dynamic`; nothing here cargo-feature-gates them
# because the per-target gating happens via `cfg(target_os = ...)`.
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
