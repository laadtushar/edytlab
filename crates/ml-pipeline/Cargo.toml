[package]
name = "ml-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The ONNX Runtime binding, declared once in the root `Cargo.toml` (the
# exact version, the `api-23` level and why). `runtime::ensure` picks the
# library file, because `ort` itself deadlocks on one it cannot load.
ort.workspace = true
# `runtime::ensure` checks a library before `ort` sees it. The version
# `ort` itself uses, so the workspace builds one copy.
libloading = "0.9"
# The model downloader (`download.rs`). `rustls-tls` and `blocking` match
# the `mcp` crate, so the workspace links one HTTP and TLS stack.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
# The cross-process lock on an artifact (`download.rs`): `flock` on Unix,
# `LockFileEx` on Windows, over a plain `std::fs::File`. Its `FileExt`
# mirrors the `File::try_lock` that std stabilised in Rust 1.89, so this
# crate can go once the toolchain pin (1.88) moves past that.
fs4 = "1.1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# `tests/download.rs` calls the downloader from inside a runtime, as the
# async Tauri commands do.
tokio = { version = "1", features = ["rt"] }
