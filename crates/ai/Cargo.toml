[package]
name = "ai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Lets `chatgpt::Endpoints::loopback_for_tests` point the ChatGPT session at a
# mock issuer on this machine. Nothing in the app enables it: only `ai`'s own
# dev-dependency on itself (below) does, so it is on for this crate's tests
# and off in every build of the desktop app and the CLI, debug or release
# (`cargo tree -p edytlab-desktop -e features -i ai` shows it is absent).
# See "Endpoints" in src/chatgpt/mod.rs.
test-endpoints = []

[dependencies]
tools = { path = "../tools" }
session = { path = "../session" }
memory = { path = "../memory" }
skills = { path = "../skills" }
agent_profiles = { path = "../agent_profiles" }
audio-engine = { path = "../audio-engine" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eventsource-stream = "0.2"
futures-util = "0.3"
thiserror = "2"
# Linux: the Secret Service (persistent), with keyutils kept for the session-only fallback and the migration; see crates/ai/src/keychain.rs.
# `crypto-rust` makes keyring's Cargo.lock entry list the async `secret-service`/`zbus` crates too (its weak `secret-service?/crypto-rust`); they are not built.
keyring = { version = "3", default-features = false, features = ["linux-native", "sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }
tracing = "0.1"
# The OAuth client (src/oauth/, #474). Each was already in Cargo.lock as a
# dependency of reqwest/rustls/tokio, so none adds a crate to the build.
# ring: RS256 ID-token signatures, SHA-256 for PKCE, the OS random generator.
ring = "0.17"
base64 = "0.22"
url = "2"
# Constant-time comparison of the callback's `state` and the ID token's `nonce`.
subtle = "2.6"
# The ChatGPT session's cross-process refresh lock (`flock`, or `LockFileEx`
# on Windows). Already in Cargo.lock through ml-pipeline, which locks its
# model downloads the same way.
fs4 = "1.1"

[target.'cfg(windows)'.dependencies]
# SO_EXCLUSIVEADDRUSE on the OAuth loopback listener (src/oauth/loopback.rs).
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
# This crate again, with the mock-issuer seam, for its own tests only.
ai = { path = ".", features = ["test-endpoints"] }
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "test-util"] }
tempfile = "3"
hound = "3.5"
audio-decoder = { path = "../audio-decoder" }
# OAuth tests: an RSA key generated at test time to sign ID tokens, and a
# second socket that tries to take over the loopback listener's port.
num-bigint = "0.4"
socket2 = "0.6"
# The ChatGPT refresh-lock test's second process takes the lock with it.
fs4 = "1.1"
