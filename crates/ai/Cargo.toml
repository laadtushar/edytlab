[package]
name = "ai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tools = { path = "../tools" }
session = { path = "../session" }
memory = { path = "../memory" }
skills = { path = "../skills" }
agent_profiles = { path = "../agent_profiles" }
audio-engine = { path = "../audio-engine" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eventsource-stream = "0.2"
futures-util = "0.3"
thiserror = "2"
# Linux: the Secret Service (persistent), with keyutils kept for the session-only fallback and the migration; see crates/ai/src/keychain.rs.
# `crypto-rust` makes keyring's Cargo.lock entry list the async `secret-service`/`zbus` crates too (its weak `secret-service?/crypto-rust`); they are not built.
keyring = { version = "3", default-features = false, features = ["linux-native", "sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "test-util"] }
tempfile = "3"
hound = "3.5"
audio-decoder = { path = "../audio-decoder" }
