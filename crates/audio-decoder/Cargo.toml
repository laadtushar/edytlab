[package]
name = "audio-decoder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Importable formats (#764): MP3, WAV, FLAC, Ogg Vorbis, Opus and AIFF.
# symphonia's default features are off and every feature the app uses is named,
# so that the list says what the app opens and a change to the defaults can
# neither drop a format nor change how one decodes. The list is what 0.5.5
# decoded with: its defaults (`adpcm`, `flac`, `mkv`, `ogg`, `pcm`, `vorbis`,
# `wav`; `pcm` and `adpcm` are the WAV and AIFF codecs), `mp3` and `aiff`, and
# `id3v2`, the only tag reader 0.5.5 ran before a format. 0.6 added `opt-simd`
# to its defaults, rustfft's SIMD FFT, which picks its code by CPU at run time
# and moves most Vorbis samples by up to 3e-7 from 0.5.5's (measured on x86-64);
# and `ape` and `id3v1`, readers of tags at a file's end that 0.5.5 did not run.
# They are left out so that every file decodes to the samples it did
# (`tests/pinned_output.rs`).
# `aac` and `isomp4` (M4A/AAC) are left out on purpose: AAC decoders need a
# patent licence from Via LA. symphonia 0.5.5 and 0.6.1 have no Opus codec, so
# `src/opus.rs` registers one next to symphonia's: it reads the Ogg Opus packets
# symphonia's demuxer yields and decodes them with `opus-decoder` (pure Rust, no
# unsafe, MIT OR Apache-2.0, RFC 8251 conformant).
# M4A/AAC is decoded by the operating system instead (`src/os_aac/`, below).
symphonia = { version = "0.6.1", default-features = false, features = [
    "adpcm",
    "aiff",
    "flac",
    "id3v2",
    "mkv",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
# `hound` powers the streaming WAV reader added in Phase 2 M22 (constant-memory
# multi-track render). The buffered `decode_file` path still uses symphonia for
# multi-format support; only WAV needs the chunked path because the M22 render
# graph operates on WAV sources exclusively.
hound = "3.5"
thiserror = "2"
opus-decoder = "0.1.1"

# M4A/AAC through the operating system's own decoder (#764), so the AAC patent
# licence is Apple's or Microsoft's and no AAC decoder is built into the app.
# Target-specific: a Linux build pulls neither. Only the bindings the module
# calls are enabled.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = [
    "std",
    "AudioFile",
    "ExtendedAudioFile",
    "objc2-core-audio-types",
    "objc2-core-foundation",
] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = [
    "std",
    "CoreAudioBaseTypes",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFURL",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", default-features = false, features = [
    "std",
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
] }

[build-dependencies]
hound = "3.5"
shine-rs = "0.1"

[dev-dependencies]
proptest = "1"
rustfft = "6"
hound = "3.5"
