[package]
name = "audio-decoder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
symphonia = { version = "0.5", features = ["mp3", "wav", "flac"] }
# `hound` powers the streaming WAV reader added in Phase 2 M22 (constant-memory
# multi-track render). The buffered `decode_file` path still uses symphonia for
# multi-format support; only WAV needs the chunked path because the M22 render
# graph operates on WAV sources exclusively.
hound = "3.5"
thiserror = "2"

[build-dependencies]
hound = "3.5"
shine-rs = "0.1"

[dev-dependencies]
proptest = "1"
rustfft = "6"
hound = "3.5"
