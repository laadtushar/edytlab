[package]
name = "audio-decoder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Importable formats (#764): MP3, WAV, FLAC, Ogg Vorbis, Opus and AIFF. `ogg`
# and `vorbis` are in symphonia's default features already; they are named here
# so that the list says what the app opens and a change to the defaults cannot
# drop them. `aac` and `isomp4` (M4A/AAC) are left out on purpose: AAC decoders
# need a patent licence from Via LA. symphonia 0.5.5 and 0.6.1 have no Opus
# codec, so `src/opus.rs` registers one next to symphonia's: it reads the Ogg
# Opus packets symphonia's demuxer yields and decodes them with `opus-decoder`
# (pure Rust, no unsafe, MIT OR Apache-2.0, RFC 8251 conformant).
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "ogg", "vorbis", "aiff"] }
# `hound` powers the streaming WAV reader added in Phase 2 M22 (constant-memory
# multi-track render). The buffered `decode_file` path still uses symphonia for
# multi-format support; only WAV needs the chunked path because the M22 render
# graph operates on WAV sources exclusively.
hound = "3.5"
thiserror = "2"
opus-decoder = "0.1.1"

[build-dependencies]
hound = "3.5"
shine-rs = "0.1"

[dev-dependencies]
proptest = "1"
rustfft = "6"
hound = "3.5"
