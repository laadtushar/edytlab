[package]
name = "ml-whisper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# `ort 2.0` is still in RC; the root `Cargo.toml` pins it exactly and holds
# the features (including why `load-dynamic`, and the `api-23` level).
#
# The runtime is opened by `ml_pipeline::runtime::ensure` at first use, from
# `ORT_DYLIB_PATH` or next to the executable. Tests that need it are
# `#[ignore]`d. Execution-provider opt-ins (CoreML, CUDA)
# arrive in Phase 2 as cargo features on this crate.
ort.workspace = true
ndarray = "0.16"
audio-decoder = { path = "../audio-decoder" }
# The runtime gate: `ort` panics, rather than erroring, when its own load of
# the ONNX Runtime library fails, so `WhisperModel::load` asks ml-pipeline
# first.
ml-pipeline = { path = "../ml-pipeline" }
rubato = "0.16"
# The 400-point real FFT behind the log-mel spectrogram (`mel.rs`). The
# workspace-blessed FFT path, as in audio-time, audio-analysis and ml-demucs.
realfft = "3"
# Reading `tokenizer.json` (`tokenizer.rs`).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
hound = "3.5"
tempfile = "3"
