[package]
name = "edytlab-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Pure infrastructure — drives the same core stack the desktop app uses,
# but exposes one turn of the agent loop over stdin/stdout for E2E tests
# and headless smoke runs on CI.
[[bin]]
name = "edytlab-cli"
path = "src/main.rs"

[dependencies]
ai = { path = "../../crates/ai" }
audio-engine = { path = "../../crates/audio-engine" }
session = { path = "../../crates/session" }
tools = { path = "../../crates/tools" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
assert_cmd = "2"
audio-decoder = { path = "../../crates/audio-decoder" }
hound = "3.5"
serde_json = "1"
tempfile = "3"
