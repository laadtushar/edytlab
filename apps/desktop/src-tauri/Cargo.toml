[package]
name = "edytlab-desktop"
version.workspace = true
description = "edytlab — conversational audio editor (Tauri shell)"
edition = "2021"
license.workspace = true
publish = false

[lib]
name = "edytlab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
# Linux: the Secret Service (persistent), with keyutils kept for the session-only fallback and the migration; see crates/ai/src/keychain.rs.
# `crypto-rust` makes keyring's Cargo.lock entry list the async `secret-service`/`zbus` crates too (its weak `secret-service?/crypto-rust`); they are not built.
keyring = { version = "3", default-features = false, features = ["linux-native", "sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }

uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

ai = { path = "../../../crates/ai" }
agent_profiles = { path = "../../../crates/agent_profiles" }
audio-engine = { path = "../../../crates/audio-engine" }
mcp = { path = "../../../crates/mcp" }
# `ml_runtime_status` (commands.rs) reports which ONNX Runtime library the
# loader found, and `lib.rs` tells the loader where the installer put it.
ml-pipeline = { path = "../../../crates/ml-pipeline" }
memory = { path = "../../../crates/memory" }
session = { path = "../../../crates/session" }
skills = { path = "../../../crates/skills" }
tools = { path = "../../../crates/tools" }
recorder = { path = "../../../crates/recorder" }
regex = "1"
# `bundled_skills`: the hash that says whether a skill file is still the text the app installed. Already in the lockfile (ml-pipeline).
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
# Opens the system browser for Sign in with ChatGPT (#474). Used from Rust only (`open_url`): it is never registered with `.plugin(..)`, so the window gets no opener command, capability or permission, and the CSP is unchanged. The crate has no cargo features, so there is nothing to switch off, and on Linux it depends on `zbus` (5.x) unconditionally (for its reveal-in-folder support, which is not used). Locked at 2.5.x: 2.7.x re-resolved about 300 unrelated lines of Cargo.lock.
tauri-plugin-opener = "2.5"

[dev-dependencies]
# The tests open stores the raw way; see `Store::open`. A dev-dependency, so a plain build of this crate has no such open.
session = { path = "../../../crates/session", features = ["raw-open"] }
tauri = { version = "2", features = ["test"] }
# Timeouts in the tests that wait on a signal, so a hang fails instead of stalling.
tokio = { version = "1", features = ["time"] }
tempfile = "3"
