# DeepSource analyses with the config stored in its dashboard, not with this
# file (its "use .deepsource.toml" preference is off). This file is the
# reviewed record of that config: change both together, so the two stay
# identical (the DeepSource connector's save_repository_config writes the
# stored one).
# https://docs.deepsource.com/docs/platform/getting-started/configure-analyzers
# Options: https://docs.deepsource.com/docs/platform/reference/core-analyzers
version = 1

# Left out of analysis, as DeepSource's troubleshooting page advises for test
# fixtures, generated code and third-party code (its time limit is 25 minutes):
# https://docs.deepsource.com/docs/platform/support/troubleshooting
exclude_patterns = [
  # A frozen record of replaced recordings and the scripts that made them,
  # never run (also excluded from SonarCloud, .sonarcloud.properties).
  "marketing/archive/**",
  # Recorded audio, model outputs and the scripts that made them; reference.py
  # copies pyannote.audio's functions verbatim (crates/ml-diarize).
  "**/tests/fixtures/**",
  # Static files served as they are: images, video, captions, favicons.
  "website/public/**",
  # Generated by the notices script and by tools_reference_doc.rs.
  "apps/desktop/src-tauri/licenses/**",
  "docs/tools-reference.md",
]

test_patterns = [
  "crates/*/tests/**",
  "apps/cli/tests/**",
  "apps/desktop/src-tauri/tests/**",
  # Shared helpers that crate tests include with #[path = ...].
  "test-support/**",
  "apps/desktop/src/**/__tests__/**",
  "apps/desktop/e2e/**",
  "apps/desktop/e2e-native/**",
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*.test.mjs",
]

[[analyzers]]
name = "rust"
enabled = true

  [analyzers.meta]
  # rust-toolchain.toml pins the toolchain CI builds with.
  msrv = "1.90.0"

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  plugins = ["react"]
  environment = ["nodejs", "browser", "vitest"]
  dialect = "typescript"
  module_system = "es-modules"
  # The desktop window and the website are separate packages: the website is
  # outside the pnpm workspace and has its own lockfile.
  dependency_file_paths = ["apps/desktop", "website"]

[[analyzers]]
name = "python"
enabled = true

  [analyzers.meta]
  runtime_version = "3.x.x"

[[analyzers]]
name = "shell"
enabled = true

  [analyzers.meta]
  dialect = "bash"

# Finds committed keys and tokens. It reads no options.
[[analyzers]]
name = "secrets"
enabled = true
