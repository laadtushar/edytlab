# cargo-about configuration for THIRD_PARTY_NOTICES.txt.
# Run through scripts/third-party-notices/generate.mjs; see docs/development-guide.md.
#
# `accepted` is also the order of preference for a crate that offers a choice
# of licences ("MIT OR Apache-2.0" is satisfied by the first one listed). It is
# the complete list of licences the shipped program may contain. A dependency
# under anything else (a GPL, LGPL, EPL or an unknown licence) makes
# cargo-about fail rather than be added silently: that is a decision for the
# project owner, not for a lockfile bump.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]

# Every platform an installer is built for (release-dev.yml, release-signed.yml).
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

ignore-dev-dependencies = true
ignore-build-dependencies = true
# edytlab's own crates are MIT (workspace.package.license); they are not third parties.
private = { ignore = true }

# ---------------------------------------------------------------------------
# Clarifications: crates whose licence file cargo-about does not pick up by
# itself (an unusual file name such as `license-mit` or `LICENSE_MIT`, or two
# licences in one file). Each names the file and its SHA-256, so a release of
# the crate that changes the file stops matching and falls back to the
# standard text (the template then says so) instead of silently shipping
# something else. Crates that ship no licence file at all need no entry.
# ---------------------------------------------------------------------------

