[workspace]
resolver = "2"
members = [
    "apps/cli",
    "apps/desktop/src-tauri",
    "crates/ai",
    "crates/audio-analysis",
    "crates/audio-decoder",
    "crates/audio-dsp",
    "crates/audio-engine",
    "crates/audio-time",
    "crates/agent_profiles",
    "crates/mcp",
    "crates/memory",
    "crates/skills",
    "crates/ml-demucs",
    "crates/ml-pipeline",
    "crates/ml-whisper",
    "crates/session",
    "crates/tools",
    "crates/recorder",
]

[workspace.package]
version = "0.8.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/laadtushar/edytlab"
publish = false

[workspace.dependencies]
# One declaration of `ort` for ml-pipeline, ml-whisper and ml-demucs, so the
# workspace builds a single copy with a single set of features.
#
# `=` pins it exactly. `ort` 2.0 is still a release candidate, and the
# candidates are not drop-in: a caret requirement matches a later one, so a
# plain `cargo update` could take it. rc.13 did break the build that way,
# gating the execution providers behind features and dropping rc.12's
# `CoreMLExecutionProvider` / `CUDAExecutionProvider` names. Move to the
# next one on purpose, in a PR of its own.
#
# `api-23` is the ONNX Runtime API level `ort` is built for, and `ort`
# refuses any library older than that level (`ort::MINOR_VERSION`). The
# installers pin ONNX Runtime 1.23.2, the newest release with a macOS build
# for Intel Macs (1.24 and later are arm64 only), so the level must not go
# above 23. `ml-pipeline`'s `runtime.rs` has a test for it. A newer
# library still loads: 1.31.0 does with `api-23`. See #383.
#
# `load-dynamic` keeps the build offline-friendly: the host process opens
# libonnxruntime.{so,dylib,dll} at first use, and
# `ml_pipeline::runtime::ensure` decides which file that is, because `ort`
# panics when its own load fails and falls back to a system search for a
# bare name (see that module). Tests that need the runtime are
# `#[ignore]`d.
#
# `coreml` and `cuda` build `ort::ep::CoreML` and `ort::ep::CUDA`, which
# rc.13 hides behind them. With `load-dynamic` they link and download
# nothing: whether a provider works is decided when a session is built, and
# which one is asked for is a `cfg(target_os = ...)` choice in
# `ml-pipeline`'s `onnx_session.rs`.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-23", "coreml", "cuda"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Tighten as the codebase grows; start permissive so M01 is a clean smoke gate.
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
