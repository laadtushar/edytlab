# SonarCloud automatic analysis reads this file (no sonar-project.properties is used).
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/
# marketing/archive/ is a frozen record of replaced recordings and the scripts that
# made them. It is never run, so it is left out of code analysis and duplication checks.
sonar.exclusions=marketing/archive/**
# The website's content files are lists of same-shaped entries (tool and command
# reference rows, blog posts, competitor facts), not logic, so their likeness is
# not duplication. They stay in code analysis; only the duplication check skips
# them (owner's decision, 2026-11-01).
sonar.cpd.exclusions=marketing/archive/**,website/lib/docs/*-data.ts,website/lib/blog.ts,website/lib/blog-posts-*.ts,website/lib/blog-posts-*/**,website/lib/competitors.ts
