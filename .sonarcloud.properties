# SonarCloud automatic analysis reads this file (no sonar-project.properties is used).
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/
# marketing/archive/ is a frozen record of replaced recordings and the scripts that
# made them. It is never run, so it is left out of code analysis and duplication checks.
sonar.exclusions=marketing/archive/**
sonar.cpd.exclusions=marketing/archive/**
