name: Release (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Created if missing."
        required: true
        type: string

# Required secrets (configure under Settings → Secrets → Actions):
#   WINDOWS_CERTIFICATE             base64-encoded Authenticode .pfx
#   WINDOWS_CERTIFICATE_PASSWORD    password for the .pfx
#
# If any are missing, the build fails fast at "Verify required secrets".
#
# Note (per docs/superpowers/plans/2026-05-05-phase-1-edit-single-track.md M15):
# SmartScreen reputation must be earned through downloads — it isn't bypassed
# by signing alone. Plan for ~2 weeks of beta distribution to seed reputation.

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  build-and-sign:
    name: build + sign
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version is read from packageManager in package.json.

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Verify required secrets are set
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $missing = @()
          foreach ($name in @('WINDOWS_CERTIFICATE','WINDOWS_CERTIFICATE_PASSWORD')) {
            if (-not (Get-ChildItem env:$name -ErrorAction SilentlyContinue).Value) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing required secrets: $($missing -join ', ')"
            exit 1
          }

      - name: Decode signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          $bytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [System.IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", $bytes)
          echo "CERT_PATH=$env:RUNNER_TEMP\cert.pfx" >> $env:GITHUB_ENV

      - name: Build via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag }}
          releaseName: "edytlab ${{ inputs.tag }}"
          releaseDraft: true
          prerelease: false

      - name: Sign .msi with signtool
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $msi = Get-ChildItem -Path apps/desktop/src-tauri/target -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) {
            Write-Error "No .msi produced by tauri-action"
            exit 1
          }
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
                       Where-Object { $_.FullName -like '*x64*' } |
                       Select-Object -First 1).FullName
          & $signtool sign `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            /f $env:CERT_PATH `
            /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            $msi.FullName
          & $signtool verify /pa /v $msi.FullName

      - name: Cleanup certificate
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:RUNNER_TEMP\cert.pfx") {
            Remove-Item "$env:RUNNER_TEMP\cert.pfx" -Force
          }
