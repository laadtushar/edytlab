name: Auto-release on main

# Fires after a CI run that was triggered by a push to main in this
# repository. If CI passed, computes the next dev tag
# (`v<version>-dev.<run_number>`), pushes it, and dispatches the
# existing release-dev.yml workflow which builds unsigned mac+win
# artifacts and attaches them to a draft GitHub Release.
#
# The `branches:` filter below is NOT a base-branch restriction, and
# reading it as one is what made this workflow exploitable. GitHub
# matches it against the *triggering run's* `head_branch`, which for a
# `pull_request`-triggered CI run is the PR's source branch — so a fork
# with a branch literally named `main` produced a matching run. The job
# then tagged the fork's commit in this repo and dispatched
# release-dev.yml at that tag, where `workflow_dispatch` executes the
# workflow file as it exists at the ref: arbitrary code in a first-party
# run with a writable token and repository secrets, publishing an
# attacker-built binary under a genuine dev tag.
#
# The `if:` on the job is therefore the real boundary, and all three of
# its conditions are load-bearing:
#   - `conclusion == 'success'` — CI actually passed.
#   - `event == 'push'`         — a push to main, not a PR run. This is
#                                 the condition that closes the fork
#                                 vector; `branches:` does not.
#   - `head_repository`         — belt and braces: the run belongs to
#                                 this repo, not a fork.
#
# Why a separate workflow:
#   - release-dev.yml is kept focused on tag-push + workflow_dispatch
#     semantics so humans can still cut a beta tag manually
#     (`git tag v0.1.0-beta.1 && git push --tags`).
#   - We only want to auto-release after CI is green, so we hang off
#     `workflow_run` of CI rather than the raw `push` event.
#
# Why we explicitly dispatch release-dev:
#   The default GITHUB_TOKEN pushing a tag does NOT trigger downstream
#   tag-push workflows (GitHub suppresses this to prevent recursion).
#   So we push the tag for the historical record, then explicitly
#   `gh workflow run release-dev.yml` at that tag.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # Matches the triggering run's head_branch, not its base. See the
    # header: this narrows the trigger but does not secure it.
    branches: [main]

permissions:
  contents: write   # push tags
  actions: write    # dispatch release-dev.yml

# Don't cancel in-flight runs — every successful main CI run deserves
# its own dev release. (Concurrency is keyed loosely so a stuck run
# doesn't permanently block subsequent ones.)
concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-and-release:
    name: tag + dispatch release-dev
    # All three conditions are a security boundary, not a filter — see
    # the header comment before relaxing any of them.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the commit CI passed on
        uses: actions/checkout@v4
        with:
          # Pin to the exact SHA CI ran against — protects against
          # racing with another merge that landed between CI completion
          # and this workflow starting.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve next dev tag
        id: tag
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not read .version from tauri.conf.json"
            exit 1
          fi
          # `github.run_number` is monotonic per-workflow, so successive
          # auto-release runs always emit unique tag suffixes — no need
          # to query the registry for the next free counter.
          TAG="v${VERSION}-dev.${{ github.run_number }}"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::warning::Tag $TAG already exists locally; skipping push."
          else
            git tag -a "$TAG" \
              -m "Auto dev release for ${{ github.event.workflow_run.head_sha }}"
            git push origin "$TAG"
          fi

      - name: Dispatch release-dev.yml at the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `channel` is passed explicitly rather than relying on its
          # default. Auto-release only ever produces previews, and a
          # future change to that default must not silently turn every
          # merge to main into a release marked Latest.
          gh workflow run release-dev.yml \
            --ref "${{ steps.tag.outputs.tag }}" \
            -f tag="${{ steps.tag.outputs.tag }}" \
            -f channel=dev \
            --repo "${{ github.repository }}"

      - name: Summary
        run: |
          {
            echo "### Auto-release"
            echo ""
            echo "- **Tag:** \`${{ steps.tag.outputs.tag }}\`"
            echo "- **Commit:** \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- **release-dev.yml:** dispatched — see the [Actions tab](${{ github.server_url }}/${{ github.repository }}/actions/workflows/release-dev.yml) for the build."
          } >> "$GITHUB_STEP_SUMMARY"
