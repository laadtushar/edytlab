name: Marketing

# Auxiliary tooling checks stay separate from the release gate: auto-release.yml
# waits for the entire workflow named CI, as docs.yml and audit.yml document.
# A marketing failure still fails this workflow; it does not block app releases.
# Keep these path-filtered checks optional for PRs that do not touch marketing.
on:
  push:
    branches: [main]
    paths:
      - marketing/launch-video/**
      - marketing/promo-v0.7.0/**
      - marketing/reels/**
      - marketing/social-kit/**
      - .github/workflows/marketing.yml
  pull_request:
    paths:
      - marketing/launch-video/**
      - marketing/promo-v0.7.0/**
      - marketing/reels/**
      - marketing/social-kit/**
      - .github/workflows/marketing.yml

permissions:
  contents: read

jobs:
  narration:
    name: narration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Windows exercises portable standard-library fixtures. Linux runs the
      # same transaction suite with the remaining marketing suites below.
      - name: Narration transactions
        if: runner.os == 'Windows'
        run: python -m unittest discover -s marketing/launch-video/tools -p test_narration_transactions.py
      - name: Promo fit path contracts
        if: runner.os == 'Windows'
        run: python -m unittest discover -s marketing/promo-v0.7.0/narration/tools -p test_fit_paths.py
      # Shell fixtures and literal LF subtitle bytes have POSIX contracts.
      # Run launch, reels and promo regressions on Linux; retain Windows lock coverage.
      - name: Install marketing test dependencies
        if: runner.os == 'Linux'
        run: >-
          python -m pip install --only-binary=:all:
          numpy==1.26.4 Pillow==13.0.0 requests==2.33.0
      - name: Launch path and command contracts
        if: runner.os == 'Linux'
        run: python -m unittest discover -s marketing/launch-video/tools -p "test_*.py"
      - name: Reel path and shell contracts
        if: runner.os == 'Linux'
        run: python -m unittest discover -s marketing/reels/tools -p "test_*.py"
      - name: Promo narration contracts
        if: runner.os == 'Linux'
        run: python -m unittest discover -s marketing/promo-v0.7.0/narration/tools -p "test_*.py"
      - name: Promo Remotion path contracts
        if: runner.os == 'Linux'
        run: python -m unittest discover -s marketing/promo-v0.7.0/remotion/tools -p "test_*.py"
      - name: Install Node for marketing path contracts
        if: runner.os == 'Linux'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pnpm for Remotion typecheck
        if: runner.os == 'Linux'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # Read the existing root packageManager pin, as the core CI jobs do.
      # Only syntax/type checks run here: skip lifecycle scripts and browser/media setup.
      - name: Install Remotion typecheck dependencies
        if: runner.os == 'Linux'
        working-directory: marketing/promo-v0.7.0/remotion
        run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts
      - name: Marketing tool syntax
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import py_compile
          import subprocess
          import tempfile

          roots = tuple(map(Path, (
              "marketing/launch-video", "marketing/promo-v0.7.0",
              "marketing/reels", "marketing/social-kit",
          )))
          remotion = Path("marketing/promo-v0.7.0/remotion")
          tracked = subprocess.run(
              ["git", "ls-files", "-z", "--", *map(str, roots)],
              stdout=subprocess.PIPE, check=True,
          ).stdout
          commands = {
              ".mjs": ["node", "--check"], ".js": ["node", "--check"],
              ".sh": ["bash", "-n"],
          }
          counts = {".py": 0, ".mjs": 0, ".js": 0, ".ts": 0, ".tsx": 0, ".sh": 0}
          typescript_files = []
          with tempfile.TemporaryDirectory() as cache:
              for index, raw in enumerate(tracked.split(b"\0")):
                  if not raw:
                      continue
                  path = Path(os.fsdecode(raw))
                  if path.suffix not in counts:
                      continue
                  root = next(root for root in roots if path.is_relative_to(root))
                  resolved = path.resolve(strict=True)
                  if not resolved.is_relative_to(Path.cwd().resolve() / root) or not resolved.is_file():
                      raise ValueError(f"Source must be a file inside {root}: {path!r}")
                  if path.suffix == ".py":
                      py_compile.compile(path, cfile=str(Path(cache) / f"{index}.pyc"), doraise=True)
                  elif path.suffix in (".ts", ".tsx"):
                      if path.suffix == ".tsx" and (
                          not path.is_relative_to(remotion)
                          or not resolved.is_relative_to(remotion.resolve())
                      ):
                          raise ValueError(f"TSX source requires the Remotion typecheck: {path!r}")
                      typescript_files.append(str(path))
                  else:
                      subprocess.run([*commands[path.suffix], str(path)], check=True)
                  counts[path.suffix] += 1

          # Use the real compiler for TypeScript syntax, including plain scripts and JSX.
          # Remotion's full typecheck below also checks types; external TS only needs syntax.
          compiler = r"""
          const fs = require("node:fs");
          const {resolve} = require("node:path");
          const ts = require("./marketing/promo-v0.7.0/remotion/node_modules/typescript");
          const remotion = resolve("marketing/promo-v0.7.0/remotion");
          const config = ts.readConfigFile(resolve(remotion, "tsconfig.json"), ts.sys.readFile);
          if (config.error) throw new Error("Cannot read Remotion tsconfig.json");
          const parsed = ts.parseJsonConfigFileContent(config.config, ts.sys, remotion);
          if (parsed.errors.length) throw new Error("Invalid Remotion tsconfig.json");
          const configured = new Set(parsed.fileNames.map((file) => resolve(file)));
          for (const file of JSON.parse(fs.readFileSync(0, "utf8"))) {
            if (file.endsWith(".tsx") && !configured.has(resolve(file))) {
              throw new Error(`TSX source is outside the Remotion compiler program: ${file}`);
            }
            const result = ts.transpileModule(fs.readFileSync(file, "utf8"), {
              fileName: file,
              compilerOptions: {
                target: ts.ScriptTarget.ES2022, module: ts.ModuleKind.ESNext,
                jsx: ts.JsxEmit.ReactJSX,
              },
              reportDiagnostics: true,
            });
            const errors = result.diagnostics.filter(
              (item) => item.category === ts.DiagnosticCategory.Error,
            );
            if (errors.length) {
              for (const error of errors) {
                console.error(ts.flattenDiagnosticMessageText(error.messageText, "\n"));
              }
              throw new Error(`TypeScript syntax failed: ${file}`);
            }
          }
          """
          if typescript_files:
              subprocess.run(
                  ["node", "-e", compiler], input=json.dumps(typescript_files), text=True, check=True,
              )
          print(f"Syntax checks passed: {counts}")
          PY
      - name: Promo recording and Remotion JavaScript path contracts
        if: runner.os == 'Linux'
        run: >-
          node --test marketing/promo-v0.7.0/record/paths.test.mjs
          marketing/promo-v0.7.0/remotion/scripts/paths.test.ts
          marketing/promo-v0.7.0/remotion/scripts/tokens.test.ts
          marketing/social-kit/artifact/paths.test.mjs
          marketing/social-kit/linkedin/tokens.test.mjs
      - name: Promo Remotion TypeScript contracts
        if: runner.os == 'Linux'
        working-directory: marketing/promo-v0.7.0/remotion
        run: pnpm typecheck
