name: Release (unsigned)

# Builds unsigned .dmg (Mac), .msi / NSIS .exe (Win) and .deb /
# .AppImage (Linux) artifacts and attaches them to a GitHub Release.
# The signed pipeline (release-signed.yml) stays the source of truth
# for shippable builds once the Apple Developer ID + Authenticode certs
# are provisioned — this workflow is intentionally smaller.
#
# Two channels, chosen by the `channel` dispatch input:
#
#   dev      (default) — a preview drop. Prerelease, not marked Latest,
#                        named "(unsigned dev build)". Every tag push
#                        takes this path.
#   release            — a real versioned release. Not a prerelease,
#                        marked Latest, named plainly. Manual dispatch
#                        only: a bare `v1.2.3` tag push deliberately
#                        does NOT trigger this workflow, so that once
#                        signing exists, release-signed.yml owns those
#                        tags and an unsigned build cannot claim one by
#                        accident.
#
# Both channels carry the same install warnings, because both produce
# unsigned artifacts and the warnings are a property of the artifact,
# not of the channel.
#
# Triggers:
#   - tag push matching `v*-dev.*`, `v*-beta.*`, or `v*-rc.*` (auto, dev)
#   - workflow_dispatch with an explicit tag input (manual, either channel)
#
# End-user warnings on unsigned artifacts:
#   - macOS: "edytlab.app is damaged and can't be opened". That wording
#     is Gatekeeper refusing a quarantined app it can't verify with
#     Apple, NOT a bad download. It matters which message you get:
#     "damaged" offers only Move to Trash, so neither "Open Anyway" nor
#     right-click → Open clears it — only removing the quarantine
#     attribute does (`xattr -dr com.apple.quarantine`). The milder
#     "unidentified developer" message is the one Open Anyway fixes.
#     The release notes below give the command; getting this wrong
#     leaves users believing the download is corrupt.
#   - macOS builds here are universal (see the matrix): one .dmg for
#     both Apple Silicon and Intel, same as the signed pipeline.
#   - Windows: SmartScreen "Don't run / More info → Run anyway". Reputation
#     can't be earned without code signing, so every download stays warned.
#
# Two-job shape (create-release + build matrix):
#   The matrix runs mac + win in parallel. If each leg called
#   tauri-action with `tagName` they'd race to "find or create draft",
#   producing two draft releases for the same tag (artifacts split, or
#   the published view ends up empty). The create-release job runs
#   once, finds-or-creates a single draft, and both build legs upload
#   into it via `releaseId`. Idempotent: re-running on the same tag
#   reuses the draft; a published release on the same tag is a hard
#   error so we don't silently skip the upload.

on:
  push:
    tags:
      - "v*-dev.*"
      - "v*-beta.*"
      - "v*-rc.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0-beta.1). Created if missing."
        required: true
        type: string
      channel:
        description: "dev = prerelease preview; release = a real versioned release (not a prerelease, marked Latest)."
        required: false
        default: dev
        type: choice
        options:
          - dev
          - release
      notes:
        description: "Optional release notes, placed above the install warnings. Markdown. Previews rarely need them; a versioned release does."
        required: false
        default: ""
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

permissions:
  contents: write  # needed to create the GitHub Release + upload assets

jobs:
  create-release:
    name: create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      tag: ${{ steps.tag.outputs.tag }}
      channel: ${{ steps.tag.outputs.channel }}
    steps:
      - name: Resolve release tag and channel
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          else
            # github.ref on a tag push is `refs/tags/<tag>`. A tag push
            # only matches the dev/beta/rc patterns above, so it is
            # always the dev channel.
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Find or create draft release
        id: create
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
          NOTES: ${{ github.event.inputs.notes }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG;

            // listReleases includes drafts; getReleaseByTag does not
            // reliably return drafts, so we paginate and filter.
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 },
            );
            const matches = releases.filter((r) => r.tag_name === tag);

            const draft = matches.find((r) => r.draft === true);
            if (draft) {
              core.info(`Reusing existing draft release id ${draft.id}`);
              core.setOutput("release_id", draft.id);
              return;
            }

            const published = matches.find((r) => r.draft === false);
            if (published) {
              core.setFailed(
                `A non-draft release already exists for tag "${tag}" ` +
                `(id ${published.id}, ${published.html_url}). ` +
                `Delete it before re-running this workflow, or push a new tag.`,
              );
              return;
            }

            const isRelease = process.env.CHANNEL === "release";

            // The channel changes the opening paragraph and nothing
            // else. Everything below it describes what an unsigned
            // artifact does on the user's machine, which is identical
            // either way — a real release that happens to be unsigned
            // hits exactly the same Gatekeeper wall as a preview, and
            // omitting the instructions there would be the failure this
            // whole section exists to prevent.
            const preamble = isRelease
              ? [
                  "**Unsigned build.** The Apple Developer ID and Authenticode",
                  "certificates are not provisioned yet, so these artifacts are",
                  "not signed or notarized. They are built from a commit that",
                  "passes the full test suite on all three platforms; what they",
                  "lack is a signature, which is why the install steps below are",
                  "needed. Signed artifacts will come from release-signed.yml",
                  "once the certs exist.",
                ]
              : [
                  "**Unsigned developer preview** — convenience build for testing",
                  "on machines without code-signing infrastructure. Production",
                  "releases are produced via release-signed.yml",
                  "with the real Apple Developer ID + Authenticode certs.",
                ];

            // Caller-supplied notes go first: someone opening the page
            // wants to know what this release *is* before being told how
            // to get past Gatekeeper. The warnings still follow, because
            // they are what makes the download usable.
            const notes = (process.env.NOTES || "").trim();
            const body = [
              ...(notes ? [notes, "", "---", ""] : []),
              ...preamble,
              "",
              "### Install warnings (expected on unsigned builds)",
              "",
              "**macOS — “edytlab is damaged and can’t be opened.”**",
              "",
              "It is not damaged. macOS quarantines anything downloaded from",
              "the internet and refuses to launch a quarantined app that",
              "Apple has not notarized. The refusal is worded as damage, so",
              "the dialog offers only *Move to Trash* — there is no “Open",
              "Anyway” button, and right-click → Open does not help either.",
              "",
              "Drag the app to Applications, then clear the flag:",
              "",
              "```",
              "xattr -dr com.apple.quarantine /Applications/edytlab.app",
              "```",
              "",
              "Once per install. If you instead get the milder “unidentified",
              "developer” message, System Settings → Privacy & Security →",
              "**Open Anyway** is enough on its own.",
              "",
              "The macOS build is a **universal binary** — the same .dmg",
              "runs on Apple Silicon and Intel.",
              "",
              "**Windows** — SmartScreen will block the installer",
              "(“Microsoft Defender SmartScreen prevented an unrecognized",
              "app from starting”). Bypass: click **More info → Run anyway**.",
              "",
              `Built from commit \`${process.env.COMMIT_SHA}\`.`,
            ].join("\n");

            const { data: created } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: isRelease ? `edytlab ${tag}` : `edytlab ${tag} (unsigned dev build)`,
              body,
              // Draft either way: the publish job flips it only after
              // every matrix leg has uploaded, so a failed platform
              // leaves an inspectable draft rather than a half-populated
              // release on the public page.
              draft: true,
              prerelease: !isRelease,
              // Pin the tag to the commit this run is building.
              //
              // A draft release does not create its tag until it is
              // published. Without this, GitHub creates the tag at
              // whatever the default branch points to *at publish
              // time*, which is fifteen minutes and any number of
              // merges after the build started. The release would then
              // be tagged at one commit while its artifacts were built
              // from another — and the body a few lines up would say
              // so, which is the only way anyone would ever notice.
              //
              // `github.sha` is the commit auto-release dispatched for,
              // and the build job checks out this same sha rather than
              // the branch tip, so tag, artifacts and the "Built from
              // commit" line all name one commit.
              target_commitish: process.env.COMMIT_SHA,
            });
            core.info(`Created draft release id ${created.id}`);
            core.setOutput("release_id", created.id);

  build:
    name: build (${{ matrix.platform.name }})
    needs: create-release
    runs-on: ${{ matrix.platform.runner }}
    # 90, not 60: the macOS leg now compiles two architectures, and the
    # signed workflow — which has built universal all along — already
    # uses this budget.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-universal
            runner: macos-14
            # Universal rather than arm64: one artifact that runs on
            # both architectures beats two the user has to choose
            # between, and matches what release-signed.yml already
            # ships. A universal binary needs BOTH slices installed —
            # the runner is arm64 and `rust-toolchain.toml` declares no
            # targets, so x86_64-apple-darwin is absent unless asked
            # for.
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
            # `--bundles app,dmg` is explicit on purpose: when only
            # `bundle.targets: "all"` was used, tauri-action sometimes
            # silently dropped the .dmg and uploaded only the .app
            # archive. Listing the bundles forces both to be built and
            # surfaces a hard error if either step fails.
            args: --target universal-apple-darwin --bundles app,dmg
          - name: windows-x86_64
            runner: windows-latest
            rust_targets: ""
            # Build both Windows installer formats: .msi (WiX) and the
            # NSIS setup .exe. Users tend to prefer one or the other,
            # so we ship both.
            args: --bundles msi,nsis
          - name: linux-x86_64
            runner: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            # `.deb` for Debian/Ubuntu users, `.AppImage` as the
            # distro-agnostic fallback. Mirrors `bundle.targets` in
            # tauri.conf.json so Linux artifacts land in releases too.
            args: --target x86_64-unknown-linux-gnu --bundles deb,appimage

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit this run was dispatched for, not the branch tip.
          #
          # Without a ref, each matrix leg checks out the default branch
          # as it stands when *that leg* starts. The three legs start
          # minutes apart, so a merge landing in between would have the
          # macOS artifact built from a different commit than the
          # Windows one, in the same release, silently.
          #
          # This is the same sha `create-release` pins the tag to.
          ref: ${{ github.sha }}

      # Linux Tauri builds need GTK/WebKit/AppIndicator system libs
      # (and `libfuse2` for AppImage). No-op on the other matrix legs.
      #
      # Same azure-mirror stall that has repeatedly hung CI — see the
      # long note in ci.yml. It matters more here: a release job that
      # dies in apt has published nothing, and the tag is already cut.
      - name: Install Linux build deps
        if: matrix.platform.runner == 'ubuntu-22.04'
        timeout-minutes: 12
        run: |
          sudo sed -i 's|https\?://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true

          install_deps() {
            sudo timeout 150 apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              update
            sudo timeout 300 apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libssl-dev \
              libasound2-dev \
              libfuse2 \
              patchelf
          }
          install_deps || {
            echo "::warning::apt failed once — retrying on a fresh connection"
            sleep 10
            install_deps
          }

      - name: Install Rust toolchain (rustup-shim honours rust-toolchain.toml)
        # `@stable` bootstraps rustup; rust-toolchain.toml is then
        # auto-applied by rustup's shim on the first cargo invocation
        # (channel = 1.88, required by Tauri 2's edition2024 deps).
        #
        # Deliberately no `targets:` here — see the next step. Passing
        # them to this action installs them on **stable**, which is not
        # the toolchain the build runs on.
        uses: dtolnay/rust-toolchain@stable

      # The macOS leg died here for every dev release, and the reason is
      # worth spelling out because the previous fix looked correct.
      #
      # A universal binary links an Intel slice, which an arm64 runner
      # cannot produce unless x86_64-apple-darwin is installed. That was
      # known, and `targets: ${{ matrix.platform.rust_targets }}` was
      # passed to the toolchain action above to handle it.
      #
      # It installed the target on the wrong toolchain. The action
      # installs `stable` and adds the targets to `stable`; then
      # rust-toolchain.toml pins channel 1.88 with `profile = "minimal"`,
      # so the first cargo invocation switches to 1.88 — which has only
      # the host target. Hence:
      #
      #   failed to build x86_64-apple-darwin binary: Target
      #   x86_64-apple-darwin is not installed
      #   (installed targets: aarch64-apple-darwin)
      #
      # `rustup target add` acts on the *active* toolchain, which
      # rust-toolchain.toml decides, so doing it as its own step puts
      # the target where the build will look for it. `rustup show`
      # first, because the pinned toolchain may not be installed yet and
      # that is what triggers it.
      #
      # Listing the installed targets afterwards is not noise: the whole
      # failure was a target being absent from a toolchain nobody
      # printed.
      - name: Add cross targets to the pinned toolchain
        if: matrix.platform.rust_targets != ''
        shell: bash
        run: |
          rustup show
          rustup target add $(echo '${{ matrix.platform.rust_targets }}' | tr ',' ' ')
          rustup target list --installed

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
          # Per-OS cache key so the three matrix legs don't trample
          # each other's target dir cache.
          key: release-dev-${{ matrix.platform.name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build unsigned bundle via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # Upload to the single draft release that create-release
          # produced. Using `releaseId` (not `tagName`) means
          # tauri-action skips the find-or-create logic that would
          # otherwise race between matrix legs.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.platform.args }}

  publish:
    name: publish draft release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only publish if every matrix leg uploaded successfully. A
    # cancelled or failed leg leaves the draft in place for inspection
    # rather than shipping a partial set.
    if: ${{ needs.build.result == 'success' }}
    steps:
      - name: Flip draft -> published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # draft=false makes the release visible on the public Releases
        # page with the mac .dmg, win .msi/.exe and linux .deb/.AppImage
        # attached. `make_latest` follows the channel: a dev preview must
        # not move the "Latest" badge off a real release, and a real
        # release should take it.
        run: |
          if [ "${{ needs.create-release.outputs.channel }}" = "release" ]; then
            MAKE_LATEST=true
          else
            MAKE_LATEST=false
          fi
          # gh api flags: -F = raw (bool/number), -f = string. The
          # GitHub releases API expects `draft: bool` and
          # `make_latest: string` ("true"|"false"|"legacy").
          gh api -X PATCH \
            repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }} \
            -F draft=false \
            -f make_latest="$MAKE_LATEST" \
            >/dev/null
          echo "Published ${{ needs.create-release.outputs.channel }} release ${{ needs.create-release.outputs.tag }} (latest=$MAKE_LATEST)"
