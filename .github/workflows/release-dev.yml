name: Release (dev / unsigned)

# Builds unsigned .dmg (Mac) + .msi / NSIS .exe (Win) artifacts and
# attaches them to a draft GitHub Release. Use this for beta / preview
# drops while the real Apple Developer ID + Authenticode certs aren't
# yet provisioned. The signed pipelines (release-mac.yml,
# release-win.yml) stay as the source of truth for shippable builds —
# this workflow is intentionally smaller.
#
# Triggers:
#   - tag push matching `v*-dev.*`, `v*-beta.*`, or `v*-rc.*` (auto)
#   - workflow_dispatch with an explicit tag input (manual)
#
# End-user warnings on unsigned artifacts:
#   - macOS: "edytlab.app is damaged and can't be opened". That wording
#     is Gatekeeper refusing a quarantined app it can't verify with
#     Apple, NOT a bad download. It matters which message you get:
#     "damaged" offers only Move to Trash, so neither "Open Anyway" nor
#     right-click → Open clears it — only removing the quarantine
#     attribute does (`xattr -dr com.apple.quarantine`). The milder
#     "unidentified developer" message is the one Open Anyway fixes.
#     The release notes below give the command; getting this wrong
#     leaves users believing the download is corrupt.
#   - macOS builds here are arm64 only (see the matrix), so Intel Macs
#     are not served by this workflow at all.
#   - Windows: SmartScreen "Don't run / More info → Run anyway". Reputation
#     can't be earned without code signing, so every download stays warned.
#
# Two-job shape (create-release + build matrix):
#   The matrix runs mac + win in parallel. If each leg called
#   tauri-action with `tagName` they'd race to "find or create draft",
#   producing two draft releases for the same tag (artifacts split, or
#   the published view ends up empty). The create-release job runs
#   once, finds-or-creates a single draft, and both build legs upload
#   into it via `releaseId`. Idempotent: re-running on the same tag
#   reuses the draft; a published release on the same tag is a hard
#   error so we don't silently skip the upload.

on:
  push:
    tags:
      - "v*-dev.*"
      - "v*-beta.*"
      - "v*-rc.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0-beta.1). Created if missing."
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

permissions:
  contents: write  # needed to create the GitHub Release + upload assets

jobs:
  create-release:
    name: create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # github.ref on a tag push is `refs/tags/<tag>`
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Find or create draft release
        id: create
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG;

            // listReleases includes drafts; getReleaseByTag does not
            // reliably return drafts, so we paginate and filter.
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 },
            );
            const matches = releases.filter((r) => r.tag_name === tag);

            const draft = matches.find((r) => r.draft === true);
            if (draft) {
              core.info(`Reusing existing draft release id ${draft.id}`);
              core.setOutput("release_id", draft.id);
              return;
            }

            const published = matches.find((r) => r.draft === false);
            if (published) {
              core.setFailed(
                `A non-draft release already exists for tag "${tag}" ` +
                `(id ${published.id}, ${published.html_url}). ` +
                `Delete it before re-running this workflow, or push a new tag.`,
              );
              return;
            }

            const body = [
              "**Unsigned developer preview** — convenience build for testing",
              "on machines without code-signing infrastructure. Production",
              "releases are produced via release-mac.yml / release-win.yml",
              "with the real Apple Developer ID + Authenticode certs.",
              "",
              "### Install warnings (expected on unsigned builds)",
              "",
              "**macOS — “edytlab is damaged and can’t be opened.”**",
              "",
              "It is not damaged. macOS quarantines anything downloaded from",
              "the internet and refuses to launch a quarantined app that",
              "Apple has not notarized. The refusal is worded as damage, so",
              "the dialog offers only *Move to Trash* — there is no “Open",
              "Anyway” button, and right-click → Open does not help either.",
              "",
              "Drag the app to Applications, then clear the flag:",
              "",
              "```",
              "xattr -dr com.apple.quarantine /Applications/edytlab.app",
              "```",
              "",
              "Once per install. If you instead get the milder “unidentified",
              "developer” message, System Settings → Privacy & Security →",
              "**Open Anyway** is enough on its own.",
              "",
              "The macOS build is **Apple Silicon (arm64) only** — there is",
              "no Intel or universal binary in this release.",
              "",
              "**Windows** — SmartScreen will block the installer",
              "(“Microsoft Defender SmartScreen prevented an unrecognized",
              "app from starting”). Bypass: click **More info → Run anyway**.",
              "",
              `Built from commit \`${process.env.COMMIT_SHA}\`.`,
            ].join("\n");

            const { data: created } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `edytlab ${tag} (unsigned dev build)`,
              body,
              draft: true,
              prerelease: true,
            });
            core.info(`Created draft release id ${created.id}`);
            core.setOutput("release_id", created.id);

  build:
    name: build (${{ matrix.platform.name }})
    needs: create-release
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-arm64
            runner: macos-14
            # `--bundles app,dmg` is explicit on purpose: when only
            # `bundle.targets: "all"` was used, tauri-action sometimes
            # silently dropped the .dmg and uploaded only the .app
            # archive. Listing the bundles forces both to be built and
            # surfaces a hard error if either step fails.
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: windows-x86_64
            runner: windows-latest
            # Build both Windows installer formats: .msi (WiX) and the
            # NSIS setup .exe. Users tend to prefer one or the other,
            # so we ship both.
            args: --bundles msi,nsis
          - name: linux-x86_64
            runner: ubuntu-22.04
            # `.deb` for Debian/Ubuntu users, `.AppImage` as the
            # distro-agnostic fallback. Mirrors `bundle.targets` in
            # tauri.conf.json so Linux artifacts land in releases too.
            args: --target x86_64-unknown-linux-gnu --bundles deb,appimage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux Tauri builds need GTK/WebKit/AppIndicator system libs
      # (and `libfuse2` for AppImage). No-op on the other matrix legs.
      - name: Install Linux build deps
        if: matrix.platform.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev \
            libfuse2 \
            patchelf

      - name: Install Rust toolchain (rustup-shim honours rust-toolchain.toml)
        # `@stable` bootstraps rustup; rust-toolchain.toml is then
        # auto-applied by rustup's shim on the first cargo invocation
        # (channel = 1.88, required by Tauri 2's edition2024 deps).
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
          # Per-OS cache key so the three matrix legs don't trample
          # each other's target dir cache.
          key: release-dev-${{ matrix.platform.name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build unsigned bundle via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # Upload to the single draft release that create-release
          # produced. Using `releaseId` (not `tagName`) means
          # tauri-action skips the find-or-create logic that would
          # otherwise race between matrix legs.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.platform.args }}

  publish:
    name: publish draft release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only publish if every matrix leg uploaded successfully. A
    # cancelled or failed leg leaves the draft in place for inspection
    # rather than shipping a partial set.
    if: ${{ needs.build.result == 'success' }}
    steps:
      - name: Flip draft -> published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Single API call: latest=false (don't move the "Latest"
        # badge — these are unsigned dev builds), draft=false makes
        # the release visible on the public Releases page with the
        # mac .dmg, win .msi/.exe, and linux .deb/.AppImage attached.
        run: |
          # gh api flags: -F = raw (bool/number), -f = string. The
          # GitHub releases API expects `draft: bool` and
          # `make_latest: string` ("true"|"false"|"legacy").
          gh api -X PATCH \
            repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }} \
            -F draft=false \
            -f make_latest=false \
            >/dev/null
          echo "Published release ${{ needs.create-release.outputs.tag }}"
