name: Coverage

# Measures test coverage and sends it to DeepSource (Code Coverage), which
# reports it on each pull request and on main.
#
# What is measured, and how:
#   - Rust: every workspace test under nextest's `ci` profile, the same set
#     ci.yml runs, instrumented by cargo-llvm-cov -> LCOV with
#     repository-relative paths, DeepSource key `rust`.
#   - Frontend (apps/desktop): vitest with the V8 provider -> LCOV, key
#     `javascript`. The coverage settings live in vite.config.ts.
# DeepSource merges reports sent under the same key.
#
# Why this is its own workflow and not jobs in ci.yml: auto-release.yml tags a
# dev release only when the run named "CI" succeeds on a push to main, and the
# required checks are ci.yml's. A coverage service being down, or an
# instrumented build being slow, must never turn either red. Nothing waits on
# this workflow; do not make it a required status check.
#
# Least privilege: the two jobs that build and run the PR's code hold only
# `contents: read` and hand their LCOV files on as artifacts. A third job,
# `report`, which runs neither the tests nor the build, is the only one with
# `id-token: write`. It authenticates by OIDC, DeepSource's recommended
# method: the CLI exchanges the job's short-lived GitHub OIDC token for a
# temporary DSN, so no DeepSource secret exists.
#
# GitHub runs fork and Dependabot PRs with a read-only token, as if from a
# fork, and documents no OIDC token for them, so `report` is skipped there.
# coverage-report.yml sends Dependabot's instead: a `workflow_run` workflow
# runs from the default branch with the permissions this run lacks. Fork PRs
# go unreported (that file says why).
#
# Coverage must be attributed to the commit DeepSource analyses: the PR's head
# commit, not the merge commit actions/checkout makes by default.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded PR runs are cancelled; a run on main is left to finish so the
# commit keeps its report.
concurrency:
  group: coverage-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Every action is pinned to a commit SHA, first-party ones too, because this
# workflow mints OIDC tokens.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  rust:
    name: coverage (rust)
    runs-on: ubuntu-22.04
    # An instrumented build of the whole workspace is slower than ci.yml's
    # Linux leg, and its cache is separate.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The same packages and script as ci.yml's Linux leg
      # (scripts/ci/install-linux-build-deps.sh); apt_retry_budget.rs checks this
      # cap against the script's numbers.
      - name: Install Linux build deps
        timeout-minutes: 18
        run: bash scripts/ci/install-linux-build-deps.sh

      - name: Install Rust toolchain (rustup-shim honours rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # cargo-llvm-cov needs llvm-tools for the toolchain rust-toolchain.toml
      # selects, which is not the `stable` the step above installs.
      - name: Add llvm-tools to the pinned toolchain
        run: rustup component add llvm-tools-preview

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage-linux-x86_64
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.146

      - name: cargo llvm-cov nextest
        run: cargo llvm-cov nextest --workspace --profile ci --lcov --output-path coverage-rust.lcov

      # llvm-cov writes absolute source paths. Make them relative to the
      # repository, as the frontend report is, so each one names a file in the
      # checkout whatever directory the runner cloned into; then refuse a
      # report with no file or with a path the rewrite missed.
      - name: Make the Rust report's paths repository-relative
        run: |
          sed -i "s|^SF:${GITHUB_WORKSPACE}/|SF:|" coverage-rust.lcov
          files=$(grep -c '^SF:' coverage-rust.lcov || true)
          absolute=$(grep -c '^SF:/' coverage-rust.lcov || true)
          echo "coverage-rust.lcov: ${files} files, ${absolute} absolute paths"
          if [ "$files" -eq 0 ] || [ "$absolute" -ne 0 ]; then
            echo "::error::coverage-rust.lcov has no files or paths outside the checkout"
            exit 1
          fi

      - name: Upload the Rust report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: coverage-rust.lcov
          if-no-files-found: error
          retention-days: 3

  frontend:
    name: coverage (frontend)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: vitest with coverage
        run: pnpm --filter @edytlab/desktop test:coverage

      - name: Upload the frontend report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-javascript
          path: apps/desktop/coverage/lcov.info
          if-no-files-found: error
          retention-days: 3

  report:
    name: coverage (report)
    needs: [rust, frontend]
    # Runs when either job produced a report, and only where GitHub can issue
    # an OIDC token: not a fork PR, not Dependabot.
    if: >-
      ${{ !cancelled()
      && (needs.rust.result == 'success' || needs.frontend.result == 'success')
      && (github.event_name != 'pull_request'
          || (github.event.pull_request.head.repo.full_name == github.repository
              && github.actor != 'dependabot[bot]')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # For the report action only, from the commit this workflow file comes
      # from (on a pull request, the merge commit), so the action and its CLI
      # pin always match the workflow, main's later bumps included. Fork and
      # Dependabot PRs never reach this job. The report names the PR's head
      # commit with `commit:` below, the commit DeepSource analyses.
      - name: Checkout the report action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      # merge-multiple keeps the layout the same whether one artifact or two
      # exist: without it, a lone matching artifact is extracted straight into
      # `path` while two get a folder each (download-artifact's dist/index.js
      # at this SHA), so a report step that looked in per-artifact folders
      # would miss the one report left when the other job failed.
      - name: Download the reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
          path: ${{ runner.temp }}/coverage

      # The pinned CLI and the per-key report loop, shared with
      # coverage-report.yml. Local, so it comes from the checkout above.
      - name: Report to DeepSource
        uses: ./.github/actions/deepsource-coverage
        with:
          reports: ${{ runner.temp }}/coverage
          commit: ${{ github.event.pull_request.head.sha || github.sha }}
