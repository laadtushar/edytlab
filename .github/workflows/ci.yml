name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs to save runner minutes, but NEVER cancel a
# main-branch run — auto-release.yml hangs off CI's `workflow_run`
# completion with `if: conclusion == "success"`, and a cancelled run
# reports `cancelled` instead of `success`, which silently skips the
# auto-release. Rapid back-to-back merges to main were the symptom:
# each merge triggered CI, the next merge cancelled the prior, and we
# missed dev releases for those commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-arm64
            runner: macos-14
          - name: windows-x86_64
            runner: windows-latest
          - name: linux-x86_64
            runner: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux Tauri builds need GTK/WebKit/AppIndicator system libs.
      # Skipped on the other matrix legs.
      # `apt-get update` has twice hung against the Azure Ubuntu mirror
      # and taken the whole job to the 30-minute limit with it — the log
      # stops mid-fetch and the run is cancelled having tested nothing.
      # That reads as a CI failure on an unrelated PR, which is the
      # expensive part: a green suite that intermittently reports red
      # trains everyone to re-run rather than to look.
      #
      # `timeout-minutes: 6` fails this step in six minutes rather than
      # burning thirty, and `Retries` covers the ordinary transient. The
      # step is retried once as a whole because a stalled mirror usually
      # resolves on a fresh connection.
      - name: Install Linux build deps
        if: matrix.platform.runner == 'ubuntu-22.04'
        timeout-minutes: 6
        run: |
          install_deps() {
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libssl-dev \
              libasound2-dev
          }
          install_deps || {
            echo "::warning::apt failed once — retrying on a fresh connection"
            sleep 5
            install_deps
          }

      - name: Install Rust toolchain (rustup-shim honours rust-toolchain.toml)
        # `@stable` bootstraps rustup; the rust-toolchain.toml in the
        # repo (channel = 1.88 + rustfmt + clippy) is then auto-applied
        # by rustup's shim on the first cargo invocation. The `@master`
        # ref of this action requires an explicit `toolchain:` input,
        # which would just duplicate the pin in two places.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
          # Per-OS cache key so the matrix legs don't trample each
          # other's target dir cache.
          key: ci-${{ matrix.platform.name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version is read from packageManager in package.json (single source of truth).

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # `--test-threads=1` serialises tests within each binary so
        # tests sharing global state (e.g. crates/ai's model cache)
        # don't race. Specifically `cache_returns_within_ttl` was
        # flaking on Windows when scheduled alongside another test
        # that calls `clear_cache()`.
        run: cargo test --workspace --no-fail-fast -- --test-threads=1

      - name: pnpm build (frontend)
        run: pnpm --filter @edytlab/desktop build

      # Full Tauri bundle build is intentionally NOT in CI: it triples wall clock
      # and the release workflows (release-dev.yml / release-signed.yml) cover
      # path. CI only verifies that source compiles and tests pass.
