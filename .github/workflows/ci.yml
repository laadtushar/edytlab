name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs to save runner minutes, but NEVER cancel a
# main-branch run — auto-release.yml hangs off CI's `workflow_run`
# completion with `if: conclusion == "success"`, and a cancelled run
# reports `cancelled` instead of `success`, which silently skips the
# auto-release. Rapid back-to-back merges to main were the symptom:
# each merge triggered CI, the next merge cancelled the prior, and we
# missed dev releases for those commits.
#
# `cancel-in-progress: false` is not enough on its own: GitHub also cancels
# a run that is still *pending* when a newer run joins the same group
# (https://docs.github.com/en/actions/using-jobs/using-concurrency), and
# that is what main's history shows (runs 1570 and 1571 ended `cancelled`
# while their successor queued). So a main run gets a group of its own, the
# run id, and no push to main can displace another.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  # No debug info in CI builds (the dev and test profiles). The workspace
  # links ~190 integration-test executables plus the app's, and with full
  # debug info each link writes debug data (a PDB on Windows) that CI never
  # reads, and a panic still names its file and line
  # (that comes from the panic location, not from DWARF). Tauri's own CI
  # sets CARGO_PROFILE_DEV_DEBUG=0 for this reason and Bevy sets both:
  # https://github.com/tauri-apps/tauri/blob/dev/.github/workflows/test-core.yml
  # https://github.com/bevyengine/bevy/blob/main/.github/workflows/ci.yml
  # rust-cache hashes every CARGO* variable into its key, so this one
  # empties the cache once.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  # Decides whether the macOS and Windows legs of `build` have anything to
  # test. Both exist for platform-specific code (keychain, ONNX Runtime
  # loading, file identity, the recorder), and a change that touches only
  # `website/`, `marketing/`, `docs/` or a root-level Markdown file cannot
  # change what they check. The Linux leg still runs every test, so the
  # Rust tests that read the site and the docs (`website_tool_docs.rs`,
  # `website_provider_claims.rs`, `tools_reference_doc.rs`, ...) still run
  # on such a PR; that is why this does not skip Rust as a whole.
  #
  # It is a job, not a `paths:` filter, on purpose: a workflow skipped by
  # `paths:` leaves its required checks Pending and blocks the merge, while
  # a job that runs and skips its own steps reports Success
  # (https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks).
  # `build` keeps running as a matrix, with the same three check names, and
  # only its steps are conditional. A job-level `if:` on a matrix job would
  # report one check named `build (${{ matrix.platform.name }})`, which
  # none of the required names match.
  #
  # Same technique as astral-sh/uv (checkout depth 2 on a pull request) and
  # zed-industries/zed (a `git diff --name-only` in a job of its own):
  # https://github.com/astral-sh/uv/blob/main/.github/workflows/ci.yml
  # https://github.com/zed-industries/zed/blob/main/.github/workflows/run_tests.yml
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.diff.outputs.native }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On a pull request the checkout is the merge commit, whose first
          # parent is the base: depth 2 holds both.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Do the macOS and Windows legs have work?
        id: diff
        run: |
          native=true
          if [ "${{ github.event_name }}" = "pull_request" ] && git rev-parse --verify -q HEAD^2 >/dev/null; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            echo "Changed files:"; echo "$changed"
            # A file outside website/, marketing/, docs/, a root-level *.md,
            # docs.json and .mintignore is Rust, frontend, script or workflow
            # input. An empty diff counts as no work.
            if ! echo "$changed" | grep -qvE '^(website|marketing|docs)/|^[^/]+\.md$|^docs\.json$|^\.mintignore$'; then
              native=false
            fi
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "native=$native"

  build:
    name: build (${{ matrix.platform.name }})
    needs: changes
    # Runs even when `changes` failed (then `native` is empty and the legs
    # run in full), so a broken detector can never leave the three required
    # checks unreported.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.platform.runner }}
    env:
      # False only for macOS and Windows on a pull request that touched
      # nothing `changes` counts. Every step below that costs time carries
      # `if: env.RUN_NATIVE == 'true'`.
      RUN_NATIVE: ${{ matrix.platform.name == 'linux-x86_64' || needs.changes.outputs.native != 'false' }}
    # 45, not 30: a warm Windows run took ~27 min before nextest, the Dev
    # Drive and the frontend's move to its own job, and a toolchain bump (or
    # a change to a CARGO* variable above) empties the cache (rust-cache
    # keys on rustc and those variables), so the first run after one
    # compiles cold; a cancelled job saves no cache, so a run that
    # timed out would leave the next one cold too.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-arm64
            runner: macos-14
          - name: windows-x86_64
            runner: windows-latest
          - name: linux-x86_64
            runner: ubuntu-22.04

    steps:
      - name: Checkout
        if: env.RUN_NATIVE == 'true'
        uses: actions/checkout@v7

      # Linux Tauri builds need GTK/WebKit/AppIndicator system libs.
      # Skipped on the other matrix legs.
      #
      # The runner image points apt at azure.archive.ubuntu.com, which has
      # now stalled mid-index-fetch on four separate runs: the log shows
      # `Ign:` on every azure line, then silence until something kills the
      # job. It is not a transient — the canonical archive.ubuntu.com in
      # the same sources file answers fine in the very same log, so the
      # fix is to stop asking the mirror that doesn't answer.
      #
      # The previous attempt at this bounded the step with
      # `timeout-minutes: 6` and retried the shell function. That never
      # fired: a step timeout kills the step, so the `||` branch below it
      # is unreachable, and the job failed having only ever tried once.
      # The timeout has to be on the *command* for a retry to exist, hence
      # `timeout 150` / `timeout 300` here. `Acquire::*::Timeout` keeps a
      # single unresponsive host from eating that budget on its own.
      - name: Install Linux build deps
        if: matrix.platform.runner == 'ubuntu-22.04'
        # Budget, and why it is this number: the retry below runs
        # `install_deps` twice, and each attempt is `timeout 150` on
        # update plus `timeout 300` on install, with a 10 s pause
        # between — 2 x (150 + 300) + 10 = 910 s = 15.2 min. The cap has
        # to clear that or the second attempt is killed part-way through
        # `apt-get install`, which throws away the retry in exactly the
        # tail case it was added for (#237).
        #
        # A timed-out `update` does not abort the attempt: GitHub runs
        # steps under `bash -e`, and `errexit` is suspended inside a
        # function on the left of `||`, so `install` still runs and one
        # attempt really can reach 450 s.
        #
        # `apt_retry_budget.rs` checks this arithmetic, so changing
        # either `timeout N` without changing the cap fails CI rather
        # than waiting for a slow mirror to expose it.
        timeout-minutes: 18
        run: |
          # The runner reads its mirrors from /etc/apt/apt-mirrors.txt (sources say
          # `mirror+file:/etc/apt/apt-mirrors.txt`), and newer images keep the
          # sources in deb822 `*.sources` files, so the rewrite covers all three:
          # rewriting only `*.list` left apt on the Azure mirror, and four runs
          # timed out on it on 2026-10-22 (#660, #661, #669).
          sudo sed -i 's|https\?://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          grep -h -r azure /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            && echo "::warning::apt still names an Azure mirror" || true

          install_deps() {
            sudo timeout 150 apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              update
            sudo timeout 300 apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libssl-dev \
              libasound2-dev \
              libdbus-1-dev \
              pkg-config
          }
          install_deps || {
            echo "::warning::apt failed once — retrying on a fresh connection"
            sleep 10
            install_deps
          }

      # Windows only: the build directory on a Dev Drive (ReFS), mounted at
      # <workspace>/target so cargo, rust-cache and every path in the repo
      # see the same `target/`. A Dev Drive is a ReFS volume with Microsoft
      # Defender in performance mode, built for build output: this job
      # writes and then launches ~190 new test executables, each one scanned
      # on NTFS. Microsoft: "Dev Drive ... to improve performance for key
      # developer workloads" and build output is on its list of what to put
      # there (https://learn.microsoft.com/en-us/windows/dev-drive/); the
      # action's README measures "about 25% or more" on build and test
      # (https://github.com/samypr100/setup-dev-drive), and astral-sh/uv
      # runs its Windows tests on one
      # (https://github.com/astral-sh/uv/blob/main/.github/workflows/setup-dev-drive.ps1).
      # After checkout, because mounting onto the workspace folder itself
      # makes checkout fail (the action's README). 16 GB is a dynamic
      # (sparse) size below the ~15 GB the README gives as free on a public
      # runner; the debug-less target is far smaller. `trusted-dev-drive`
      # is what selects Defender's performance mode.
      - name: Set up Dev Drive for target/ (Windows)
        if: matrix.platform.name == 'windows-x86_64' && env.RUN_NATIVE == 'true'
        uses: samypr100/setup-dev-drive@v4.1.0
        with:
          drive-size: 16GB
          drive-format: ReFS
          mount-path: ${{ github.workspace }}/target
          trusted-dev-drive: true

      - name: Install Rust toolchain (rustup-shim honours rust-toolchain.toml)
        if: env.RUN_NATIVE == 'true'
        # `@stable` bootstraps rustup; the rust-toolchain.toml in the
        # repo (channel = 1.90 + rustfmt + clippy) is then auto-applied
        # by rustup's shim on the first cargo invocation. The `@master`
        # ref of this action requires an explicit `toolchain:` input,
        # which would just duplicate the pin in two places.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        if: env.RUN_NATIVE == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
          # Per-OS cache key so the matrix legs don't trample each
          # other's target dir cache.
          key: ci-${{ matrix.platform.name }}
          # Save only from main (#610). A PR that changes Cargo.lock
          # restores a partial match, and uploading a new cache from the
          # PR ran the Windows leg past its 30-minute limit after every
          # step had passed. PRs still restore main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Formatting is the same on every OS (rustfmt reads rustfmt.toml and
      # the sources, not the platform), so one leg checks it.
      - name: cargo fmt --check
        if: matrix.platform.name == 'linux-x86_64'
        run: cargo fmt --all --check

      # Per OS, deliberately: 34 source files carry `cfg(target_os)`,
      # `cfg(windows)` or `cfg(unix)` (keychain, ONNX Runtime loading,
      # file identity, the recorder, the ChatGPT token store), and clippy
      # only lints the code a platform compiles. It costs ~1.5 min a leg
      # on a warm cache (run 40381239991).
      - name: cargo clippy
        if: env.RUN_NATIVE == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # cargo-nextest runs each test in its own process
      # (https://nexte.st/docs/design/why-process-per-test/), so the global
      # state `--test-threads=1` used to protect cannot be shared in the
      # first place: `--test-threads=1` came in with #48 to stop
      # `cache_returns_within_ttl` racing another test that clears crates/ai's
      # process-wide model cache on Windows, and a statically shared cache
      # now belongs to one test's process. The registry, `set_bundle_dir`,
      # `set_settings_dir` and `tools::progress` are in-process statics, so
      # they are isolated the same way. What nextest does not isolate is a
      # file or port outside the process: the tests use temp dirs and no
      # fixed port (`git grep` for both found none), and the OS keychain
      # tests are `#[ignore]`d. Tests run in parallel, one per core, where
      # `cargo test -- --test-threads=1` ran them one at a time.
      # Settings are in .config/nextest.toml (profile `ci`).
      # Pinned: the action to a release tag more than two weeks old, the
      # tool to a version older than that.
      - name: Install cargo-nextest
        if: env.RUN_NATIVE == 'true'
        uses: taiki-e/install-action@v2.87.25
        with:
          tool: cargo-nextest@0.9.146

      - name: cargo nextest run
        if: env.RUN_NATIVE == 'true'
        run: cargo nextest run --workspace --profile ci

      # nextest does not run doctests ("Doctests are currently not
      # supported because of limitations in stable Rust",
      # https://nexte.st/docs/running/), and the workspace has some
      # (`LiveStore`'s `compile_fail` one pins that the open project can
      # only be a store the registry made). `--doc` builds nothing else.
      - name: cargo test --doc
        if: env.RUN_NATIVE == 'true'
        run: cargo test --workspace --doc --no-fail-fast

      # A model run on the real ONNX Runtime, the version the app pins
      # (#383). `ml-pipeline`'s `cache_smoke` tests build a session from
      # `tests/fixtures/identity.onnx` and run it, but they are `#[ignore]`d
      # because `ort` is linked `load-dynamic` and the workspace step above
      # has no library to give it, so until this step nothing in CI ever
      # executed a model. `apps/desktop/src-tauri/ml-runtime.json` is the
      # single source of the version, URL and SHA-256, and the script checks
      # the archive against it, so a corrupt or swapped download fails here
      # and never reaches the test.
      #
      # One Linux leg: it checks that the pinned runtime and the `ort`
      # binding agree. The macOS and Windows libraries are not run here:
      # the release workflows check every installer, including the app
      # binary loading the library it carries
      # (scripts/installer-ml-runtime.py, #383).
      #
      # The cache holds the unpacked library (22 MB) under a key made from
      # the manifest, so a changed pin misses it. The script runs either
      # way: on a hit it only re-checks the restored files against what it
      # recorded, and on a miss it downloads.
      - name: Cache ONNX Runtime
        if: matrix.platform.name == 'linux-x86_64'
        uses: actions/cache@v6
        with:
          path: ml-runtime/linux-x64
          key: ml-runtime-linux-x64-${{ hashFiles('apps/desktop/src-tauri/ml-runtime.json') }}

      - name: Fetch ONNX Runtime
        if: matrix.platform.name == 'linux-x86_64'
        run: bash scripts/fetch-ml-runtime.sh linux-x64 ml-runtime/linux-x64

      - name: cargo test (ONNX Runtime smoke)
        if: matrix.platform.name == 'linux-x86_64'
        env:
          ORT_DYLIB_PATH: ${{ github.workspace }}/ml-runtime/linux-x64/libonnxruntime.so
        # `--ignored` runs only the ignored tests, and they fail rather
        # than skip when the library is missing, so this step cannot go
        # green without having run a model.
        run: cargo test -p ml-pipeline --test cache_smoke --test runtime_bundle_real --test onnx_session_builder -- --ignored --test-threads=1

      # Full Tauri bundle build is intentionally NOT in CI: it triples wall clock
      # and the release workflows (release-dev.yml / release-signed.yml) cover
      # path. CI only verifies that source compiles and tests pass.

  # The frontend (vitest, the slow-scheduler run, `tsc -b` + vite build),
  # once, on Linux, in parallel with the Rust legs. It used to run at the
  # end of all three `build` legs, ~3 min of a Windows leg that is the
  # slowest job. The bundle and the tests do not depend on the OS: jsdom
  # runs them in Node, the webview is not in the loop, and the real-browser
  # run is `e2e (chromium)` below, on Linux only. `frontend (test)` is a new
  # check name: a branch rule that relied on `build (...)` to cover the
  # frontend has to require it too.
  frontend:
    name: frontend (test)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # Version is read from packageManager in package.json (single source of truth).

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # The frontend test suite was not run by CI at all.
      #
      # `cargo test` covers the Rust side and `pnpm build` proves the
      # TypeScript compiles, so a green tick meant "it builds" while
      # reading as "it passes". Every frontend guard in the repo — the
      # command palette's coverage tests, the motion vocabulary, the
      # shortcuts-are-real check, 388 assertions in all — ran only on
      # whichever machine the author happened to use, and a PR that
      # broke every one of them merged green.
      #
      # Placed before the build because a failing test is a more useful
      # first failure than a failing bundle: it names the behaviour that
      # broke rather than the step that noticed.
      - name: pnpm test (frontend)
        run: pnpm --filter @edytlab/desktop test

      # The same suite with React's scheduler running 40 ms late (#349).
      # A test that asserts on async React state without waiting for it
      # fails here every time, instead of on whichever runner happens to
      # be slow — which is how #343 went red on a test it never touched.
      # One leg: timing is what it varies, not the OS.
      - name: pnpm test (frontend, slow scheduler)
        run: pnpm --filter @edytlab/desktop test:slow-scheduler

      # `build` runs `tsc -b`, which type-checks the app, its tests and
      # vite.config.ts as three programs: the app has no Node types
      # because it runs in a webview, the tests do because they run in
      # Node (#336). `tsc -b` rather than `tsc`, because the root
      # tsconfig.json is a solution file and plain `tsc` checks nothing.
      - name: pnpm build (frontend)
        run: pnpm --filter @edytlab/desktop build

  # The frontend in a real browser (apps/desktop/e2e). jsdom has no
  # layout, no Web Audio and no shadow DOM anything renders into, so a
  # component that scrolls the wrong element or never mounts at all
  # passes every vitest there is. This drives the unmodified app in
  # Chromium with only the Rust side replaced, at the IPC boundary.
  #
  # One Linux leg rather than the matrix: it tests the frontend, which
  # is the same bundle on every OS, and a browser per OS would triple the
  # cost for no new coverage.
  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # The browser binary only — no `--with-deps`. That flag runs
      # apt-get, which is the stalling azure mirror the build job's
      # `Install Linux build deps` step exists to route around, and
      # `apt_retry_budget.rs` only guards that one step. The runner image
      # already ships Google Chrome, and with it the shared libraries
      # Chromium links against.
      - name: Install Chromium for Playwright
        run: pnpm --filter @edytlab/desktop exec playwright install chromium

      - name: Typecheck e2e
        run: pnpm --filter @edytlab/desktop typecheck:e2e

      - name: Playwright
        run: pnpm --filter @edytlab/desktop test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 7

  # The website is outside the pnpm workspace so Vercel can build it
  # standalone, which also put its logic outside every test run: #241's
  # release picker 404'd for ~186 dev builds with nothing able to catch
  # it (#303). Its own install, its own lockfile, Node only — seconds,
  # not the Rust matrix's minutes.
  website:
    name: website (test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      # `--ignore-workspace`: without it pnpm walks up to the root
      # workspace, which excludes this directory, and installs nothing.
      - name: pnpm install
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck
