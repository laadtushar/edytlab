name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs to save runner minutes, but NEVER cancel a
# main-branch run — auto-release.yml hangs off CI's `workflow_run`
# completion with `if: conclusion == "success"`, and a cancelled run
# reports `cancelled` instead of `success`, which silently skips the
# auto-release. Rapid back-to-back merges to main were the symptom:
# each merge triggered CI, the next merge cancelled the prior, and we
# missed dev releases for those commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-arm64
            runner: macos-14
          - name: windows-x86_64
            runner: windows-latest
          - name: linux-x86_64
            runner: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Linux Tauri builds need GTK/WebKit/AppIndicator system libs.
      # Skipped on the other matrix legs.
      #
      # The runner image points apt at azure.archive.ubuntu.com, which has
      # now stalled mid-index-fetch on four separate runs: the log shows
      # `Ign:` on every azure line, then silence until something kills the
      # job. It is not a transient — the canonical archive.ubuntu.com in
      # the same sources file answers fine in the very same log, so the
      # fix is to stop asking the mirror that doesn't answer.
      #
      # The previous attempt at this bounded the step with
      # `timeout-minutes: 6` and retried the shell function. That never
      # fired: a step timeout kills the step, so the `||` branch below it
      # is unreachable, and the job failed having only ever tried once.
      # The timeout has to be on the *command* for a retry to exist, hence
      # `timeout 150` / `timeout 300` here. `Acquire::*::Timeout` keeps a
      # single unresponsive host from eating that budget on its own.
      - name: Install Linux build deps
        if: matrix.platform.runner == 'ubuntu-22.04'
        # Budget, and why it is this number: the retry below runs
        # `install_deps` twice, and each attempt is `timeout 150` on
        # update plus `timeout 300` on install, with a 10 s pause
        # between — 2 x (150 + 300) + 10 = 910 s = 15.2 min. The cap has
        # to clear that or the second attempt is killed part-way through
        # `apt-get install`, which throws away the retry in exactly the
        # tail case it was added for (#237).
        #
        # A timed-out `update` does not abort the attempt: GitHub runs
        # steps under `bash -e`, and `errexit` is suspended inside a
        # function on the left of `||`, so `install` still runs and one
        # attempt really can reach 450 s.
        #
        # `apt_retry_budget.rs` checks this arithmetic, so changing
        # either `timeout N` without changing the cap fails CI rather
        # than waiting for a slow mirror to expose it.
        timeout-minutes: 18
        run: |
          # The runner reads its mirrors from /etc/apt/apt-mirrors.txt (sources say
          # `mirror+file:/etc/apt/apt-mirrors.txt`), and newer images keep the
          # sources in deb822 `*.sources` files, so the rewrite covers all three:
          # rewriting only `*.list` left apt on the Azure mirror, and four runs
          # timed out on it on 2026-10-22 (#660, #661, #669).
          sudo sed -i 's|https\?://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          grep -h -r azure /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            && echo "::warning::apt still names an Azure mirror" || true

          install_deps() {
            sudo timeout 150 apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              update
            sudo timeout 300 apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libssl-dev \
              libasound2-dev \
              libdbus-1-dev \
              pkg-config
          }
          install_deps || {
            echo "::warning::apt failed once — retrying on a fresh connection"
            sleep 10
            install_deps
          }

      - name: Install Rust toolchain (rustup-shim honours rust-toolchain.toml)
        # `@stable` bootstraps rustup; the rust-toolchain.toml in the
        # repo (channel = 1.88 + rustfmt + clippy) is then auto-applied
        # by rustup's shim on the first cargo invocation. The `@master`
        # ref of this action requires an explicit `toolchain:` input,
        # which would just duplicate the pin in two places.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
          # Per-OS cache key so the matrix legs don't trample each
          # other's target dir cache.
          key: ci-${{ matrix.platform.name }}
          # Save only from main (#610). A PR that changes Cargo.lock
          # restores a partial match, and uploading a new cache from the
          # PR ran the Windows leg past its 30-minute limit after every
          # step had passed. PRs still restore main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # Version is read from packageManager in package.json (single source of truth).

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # `--test-threads=1` serialises tests within each binary so
        # tests sharing global state (e.g. crates/ai's model cache)
        # don't race. Specifically `cache_returns_within_ttl` was
        # flaking on Windows when scheduled alongside another test
        # that calls `clear_cache()`.
        run: cargo test --workspace --no-fail-fast -- --test-threads=1

      # A model run on the real ONNX Runtime, the version the app pins
      # (#383). `ml-pipeline`'s `cache_smoke` tests build a session from
      # `tests/fixtures/identity.onnx` and run it, but they are `#[ignore]`d
      # because `ort` is linked `load-dynamic` and the workspace step above
      # has no library to give it, so until this step nothing in CI ever
      # executed a model. `apps/desktop/src-tauri/ml-runtime.json` is the
      # single source of the version, URL and SHA-256, and the script checks
      # the archive against it, so a corrupt or swapped download fails here
      # and never reaches the test.
      #
      # One Linux leg: it checks that the pinned runtime and the `ort`
      # binding agree. The macOS and Windows libraries are not run here:
      # the release workflows check every installer, including the app
      # binary loading the library it carries
      # (scripts/installer-ml-runtime.py, #383).
      #
      # The cache holds the unpacked library (22 MB) under a key made from
      # the manifest, so a changed pin misses it. The script runs either
      # way: on a hit it only re-checks the restored files against what it
      # recorded, and on a miss it downloads.
      - name: Cache ONNX Runtime
        if: matrix.platform.name == 'linux-x86_64'
        uses: actions/cache@v6
        with:
          path: ml-runtime/linux-x64
          key: ml-runtime-linux-x64-${{ hashFiles('apps/desktop/src-tauri/ml-runtime.json') }}

      - name: Fetch ONNX Runtime
        if: matrix.platform.name == 'linux-x86_64'
        run: bash scripts/fetch-ml-runtime.sh linux-x64 ml-runtime/linux-x64

      - name: cargo test (ONNX Runtime smoke)
        if: matrix.platform.name == 'linux-x86_64'
        env:
          ORT_DYLIB_PATH: ${{ github.workspace }}/ml-runtime/linux-x64/libonnxruntime.so
        # `--ignored` runs only the ignored tests, and they fail rather
        # than skip when the library is missing, so this step cannot go
        # green without having run a model.
        run: cargo test -p ml-pipeline --test cache_smoke --test runtime_bundle_real --test onnx_session_builder -- --ignored --test-threads=1

      # The frontend test suite was not run by CI at all.
      #
      # `cargo test` covers the Rust side and `pnpm build` proves the
      # TypeScript compiles, so a green tick meant "it builds" while
      # reading as "it passes". Every frontend guard in the repo — the
      # command palette's coverage tests, the motion vocabulary, the
      # shortcuts-are-real check, 388 assertions in all — ran only on
      # whichever machine the author happened to use, and a PR that
      # broke every one of them merged green.
      #
      # Placed before the build because a failing test is a more useful
      # first failure than a failing bundle: it names the behaviour that
      # broke rather than the step that noticed.
      - name: pnpm test (frontend)
        run: pnpm --filter @edytlab/desktop test

      # The same suite with React's scheduler running 40 ms late (#349).
      # A test that asserts on async React state without waiting for it
      # fails here every time, instead of on whichever runner happens to
      # be slow — which is how #343 went red on a test it never touched.
      # One leg: timing is what it varies, not the OS.
      - name: pnpm test (frontend, slow scheduler)
        if: matrix.platform.name == 'linux-x86_64'
        run: pnpm --filter @edytlab/desktop test:slow-scheduler

      # `build` runs `tsc -b`, which type-checks the app, its tests and
      # vite.config.ts as three programs: the app has no Node types
      # because it runs in a webview, the tests do because they run in
      # Node (#336). `tsc -b` rather than `tsc`, because the root
      # tsconfig.json is a solution file and plain `tsc` checks nothing.
      - name: pnpm build (frontend)
        run: pnpm --filter @edytlab/desktop build

      # Full Tauri bundle build is intentionally NOT in CI: it triples wall clock
      # and the release workflows (release-dev.yml / release-signed.yml) cover
      # path. CI only verifies that source compiles and tests pass.

  # The frontend in a real browser (apps/desktop/e2e). jsdom has no
  # layout, no Web Audio and no shadow DOM anything renders into, so a
  # component that scrolls the wrong element or never mounts at all
  # passes every vitest there is. This drives the unmodified app in
  # Chromium with only the Rust side replaced, at the IPC boundary.
  #
  # One Linux leg rather than the matrix: it tests the frontend, which
  # is the same bundle on every OS, and a browser per OS would triple the
  # cost for no new coverage.
  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # The browser binary only — no `--with-deps`. That flag runs
      # apt-get, which is the stalling azure mirror the build job's
      # `Install Linux build deps` step exists to route around, and
      # `apt_retry_budget.rs` only guards that one step. The runner image
      # already ships Google Chrome, and with it the shared libraries
      # Chromium links against.
      - name: Install Chromium for Playwright
        run: pnpm --filter @edytlab/desktop exec playwright install chromium

      - name: Typecheck e2e
        run: pnpm --filter @edytlab/desktop typecheck:e2e

      - name: Playwright
        run: pnpm --filter @edytlab/desktop test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 7

  # The website is outside the pnpm workspace so Vercel can build it
  # standalone, which also put its logic outside every test run: #241's
  # release picker 404'd for ~186 dev builds with nothing able to catch
  # it (#303). Its own install, its own lockfile, Node only — seconds,
  # not the Rust matrix's minutes.
  website:
    name: website (test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      # `--ignore-workspace`: without it pnpm walks up to the root
      # workspace, which excludes this directory, and installs nothing.
      - name: pnpm install
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck
