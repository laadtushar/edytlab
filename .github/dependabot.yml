# Dependabot version updates. Docs:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# marketing/ is left out on purpose (as in .fossabot.yml): the promo, LinkedIn
# renderer and archived recording tools ship nothing, and a bump there means
# re-rendering videos the site keeps byte-identical copies of.
version: 2

updates:
  # Rust workspace (one Cargo.lock at the root).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The tauri crates and @tauri-apps/* must sit on the same major.minor,
      # and Dependabot cannot bump a Cargo crate and an npm package in one PR.
      # A minor or major Tauri upgrade is done by hand, both sides together
      # (as #800 did); patches are safe on their own.
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # ort is pinned exactly (=2.0.0-rc.13 in Cargo.toml): its release
      # candidates change how the ONNX Runtime library is loaded (CLAUDE.md,
      # the onnx_session note), rc.15 needs rustc 1.92, and only the opt-in
      # ML workflow runs the real model. An ort upgrade is a PR of its own,
      # with ml.yml run on it.
      - dependency-name: "ort"
      - dependency-name: "ort-sys"
    groups:
      tauri-patch:
        patterns: ["tauri*"]
      cargo-minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["tauri*"]

  # Desktop app (the pnpm workspace: root package.json, apps/*).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Same rule as the tauri crates above.
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # 6.10.0 is deprecated on npm.
      - dependency-name: "@testing-library/jest-dom"
        versions: ["6.10.0"]
      # Toolchain majors are migrations, done by hand in a PR of their own
      # (the first run offered TypeScript 7, Vitest 5 and Vite 8 together).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react 6 needs Vite 8, so it moves with the Vite major.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # WaveSurfer is the playback engine (CLAUDE.md lists its quirks the app
      # works around); a major is a migration with e2e on it.
      - dependency-name: "wavesurfer.js"
        update-types: ["version-update:semver-major"]
    groups:
      tauri-patch:
        patterns: ["@tauri-apps/*"]
      npm-minor-and-patch:
        update-types: [minor, patch]
        # @playwright/test is pinned exactly: each release drives a new
        # Chromium, so its bump stays a PR of its own (playwright.config.ts).
        exclude-patterns: ["@tauri-apps/*", "@playwright/test"]

  # No entry for website/: it is outside the pnpm workspace with its own
  # lockfile, and Dependabot updated website/package.json without
  # website/pnpm-lock.yaml (#810, #826), so every PR failed its frozen
  # install, and each spent a Vercel deployment (its branch names contain
  # "website"). Its updates are a by-hand lockfile refresh, as in #819.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
